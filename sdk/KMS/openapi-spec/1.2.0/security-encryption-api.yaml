security:
- basicAuth: []
components:
  schemas:
    ChangeKeyState:
      type: object
      description: 鍵の状態変更
      properties:
        Status:
          enum:
          - active
          - restricted
          - suspended
          type: string
          description: |-
            * `active` - 有効
            * `restricted` - 制限付き
            * `suspended` - 一時停止
          x-spec-enum-id: c07b47aad4f4d40c
      required:
      - Status
    ChangeKeyStateRequest:
      type: object
      description: 鍵の状態変更
      properties:
        Status:
          enum:
          - active
          - restricted
          - suspended
          type: string
          description: |-
            * `active` - 有効
            * `restricted` - 制限付き
            * `suspended` - 一時停止
          x-spec-enum-id: c07b47aad4f4d40c
      required:
      - Status
    CloudHSM:
      type: object
      properties:
        ID:
          type: string
          readOnly: true
          example: '110000000000'
        CreatedAt:
          $ref: '#/components/schemas/DateTime'
        ModifiedAt:
          $ref: '#/components/schemas/DateTime'
        ServiceClass:
          enum:
          - cloud/cloudhsm/partition
          type: string
          description: '* `cloud/cloudhsm/partition` - Type-L7'
          x-spec-enum-id: aec33bb088a5c108
          readOnly: true
          title: サービスクラス
        Availability:
          enum:
          - precreate
          - available
          - discontinued
          type: string
          description: |-
            * `precreate` - 準備中
            * `available` - 利用可能
            * `discontinued` - 廃止
          x-spec-enum-id: 329069c36229258c
          readOnly: true
          title: 状態
        Name:
          type: string
          title: 名前
          maxLength: 255
        Description:
          type: string
          title: 説明
        Tags:
          type: array
          items:
            type: string
            minLength: 1
          nullable: true
        IPv4NetworkAddress:
          type: string
          title: IPv4ネットワークアドレス
          example: 192.168.100.0
        IPv4PrefixLength:
          type: integer
          title: IPv4プレフィックス長
          example: 24
        IPv4Address:
          type: string
          readOnly: true
          example: 192.168.100.11
        LocalRouter:
          allOf:
          - $ref: '#/components/schemas/LocalRouter'
          nullable: true
          readOnly: true
        InitialData:
          allOf:
          - $ref: '#/components/schemas/CloudHSMInitialData'
          nullable: true
          readOnly: true
      required:
      - Availability
      - CreatedAt
      - Description
      - ID
      - InitialData
      - IPv4Address
      - IPv4NetworkAddress
      - IPv4PrefixLength
      - LocalRouter
      - ModifiedAt
      - Name
      - ServiceClass
      - Tags
    CloudHSMClient:
      type: object
      properties:
        ID:
          type: string
          readOnly: true
          example: 01JP9500000000000000000000
        CreatedAt:
          $ref: '#/components/schemas/DateTime'
        ModifiedAt:
          $ref: '#/components/schemas/DateTime'
        Availability:
          enum:
          - precreate
          - available
          - discontinued
          type: string
          description: |-
            * `precreate` - 準備中
            * `available` - 利用可能
            * `discontinued` - 廃止
          x-spec-enum-id: 329069c36229258c
          readOnly: true
          title: 状態
        Name:
          type: string
          title: 名前
          maxLength: 255
        Certificate:
          type: string
          readOnly: true
          title: 証明書
          example: '-----BEGIN CERTIFICATE-----\nMIIC0DCCAbigAwIBAgIJAJ.....\n-----END
            CERTIFICATE-----'
      required:
      - Availability
      - Certificate
      - CreatedAt
      - ID
      - ModifiedAt
      - Name
    CloudHSMClientRequest:
      type: object
      properties:
        Name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 255
